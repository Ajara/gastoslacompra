# Copia y cambia server_name. Nginx habla con Next en 127.0.0.1:3001
# (systemd). El API Go queda en 127.0.0.1:8082, no hace falta publicarlo.
#
# Ubuntu/Debian: /etc/nginx/sites-available/lacompra (+ symlink en sites-enabled)
# Oracle Linux / RHEL: /etc/nginx/conf.d/lacompra.conf
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d compra.TU_DOMINIO
#
# Un subdominio propio convive con la otra app sin tocar su server block.

server {
    listen 80;
    listen [::]:80;
    server_name compra.TU_DOMINIO;

    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
